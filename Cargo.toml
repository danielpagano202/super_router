[package]
name = "SuperRouter"
version = "0.1.0"
edition = "2021"

[dependencies]
axum = "0.8.9"
tokio = { version = "1.53.1", features = ["rt", "rt-multi-thread", "macros", "net", "process", "io-util"] }
walkdir = "2.5"
regex = "1.10"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
clap = { version = "4.5", features = ["derive"] }